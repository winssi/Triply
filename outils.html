<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outils — Triply</title>
  <meta name="description" content="25 ressources de design et de code pour créer des sites web modernes avec l'IA.">
  <meta name="theme-color" content="#000000">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000;
      --ink: #eeeae3;
      --muted: #8d8880;
      --faint: #5b5853;
      --line: rgba(255, 255, 255, .08);
      --line-2: rgba(255, 255, 255, .16);
      --serif: "Instrument Serif", "Times New Roman", serif;
      --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
      --ease: cubic-bezier(.16, 1, .3, 1);
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--black); overflow-x: clip; }
    body { background: var(--black); color: var(--ink); font-family: var(--sans); font-weight: 400; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: clip; }
    a { color: inherit; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }
    :focus-visible { outline: 1.5px solid var(--ink); outline-offset: 4px; border-radius: 6px; }

    /* ---------- En-tête ---------- */
    header { position: relative; z-index: 2; }
    nav { display: flex; align-items: center; justify-content: space-between; height: 84px; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--serif); font-size: 1.6rem; letter-spacing: -.01em; }
    .brand svg { width: 22px; height: 22px; }
    .back { font-size: .9rem; color: var(--muted); text-decoration: none; transition: color .3s; }
    .back:hover { color: var(--ink); }

    /* ---------- Hero ---------- */
    .hero { position: relative; padding: 72px 0 88px; }
    .halo {
      position: absolute; inset: -240px -20vw auto auto; width: 820px; height: 620px; pointer-events: none; z-index: 0;
      background: radial-gradient(closest-side, rgba(146, 122, 255, .22), transparent 70%),
                  radial-gradient(closest-side at 70% 60%, rgba(255, 160, 110, .14), transparent 70%);
      filter: blur(20px); animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift { to { transform: translate(-120px, 80px) scale(1.1); } }
    .hero h1 {
      position: relative; z-index: 1;
      font-family: var(--serif); font-weight: 400; font-size: clamp(3.2rem, 8.4vw, 7.4rem);
      line-height: .95; letter-spacing: -.035em; max-width: 11ch;
    }
    .hero h1 .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding-bottom: .08em; }
    .hero h1 .w > span { display: inline-block; transform: translateY(105%); animation: rise 1.1s var(--ease) forwards; }
    @keyframes rise { to { transform: none; } }
    .hero p { position: relative; z-index: 1; margin-top: 32px; max-width: 46ch; color: var(--muted); font-size: 1.125rem; font-weight: 300; opacity: 0; animation: fade 1s .7s var(--ease) forwards; }
    @keyframes fade { to { opacity: 1; } }

    /* ---------- Filtres ---------- */
    .bar { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; justify-content: space-between; padding: 0 0 28px; opacity: 0; animation: fade 1s .9s var(--ease) forwards; }
    .filters { display: flex; flex-wrap: wrap; gap: 4px; }
    .filter {
      font: inherit; font-size: .9rem; cursor: pointer; color: var(--muted); background: none;
      border: 1px solid transparent; border-radius: 999px; padding: 7px 14px; transition: color .3s, border-color .3s, background .3s;
    }
    .filter:hover { color: var(--ink); }
    .filter[aria-pressed=true] { color: var(--black); background: var(--ink); }
    .search-box { position: relative; flex: 0 1 300px; min-width: 0; }
    .search-box svg { position: absolute; left: 14px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
    .search {
      width: 100%; font: inherit; font-size: .92rem; color: var(--ink); background: rgba(255,255,255,.03);
      border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px 10px 38px; transition: border-color .3s, background .3s;
    }
    .search::placeholder { color: var(--faint); }
    .search:focus { outline: none; border-color: var(--line-2); background: rgba(255,255,255,.05); }

    /* ---------- Grille ---------- */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-flow: dense; gap: 14px; }
    .card {
      --a: 255, 255, 255; --x: 50%; --y: 50%;
      position: relative; display: flex; flex-direction: column; text-decoration: none;
      border-radius: 22px; padding: 10px 10px 22px; background: #050505;
      border: 1px solid var(--line); overflow: hidden; isolation: isolate;
      opacity: 0; transform: translateY(28px) scale(.98);
      transition: border-color .5s var(--ease), transform .6s var(--ease);
    }
    .card.in { animation: enter 1s var(--ease) forwards; animation-delay: var(--d, 0s); }
    @keyframes enter { to { opacity: 1; transform: none; } }
    .card::before {
      content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .5s;
      background: radial-gradient(420px circle at var(--x) var(--y), rgba(var(--a), .16), transparent 60%);
    }
    .card:hover { border-color: rgba(var(--a), .35); }
    .card:hover::before { opacity: 1; }
    .card.wide { grid-column: span 2; }

    .stage {
      position: relative; height: 230px; border-radius: 14px; overflow: hidden;
      background: #0b0b0c; display: grid; place-items: center;
    }
    .card.wide .stage { height: 270px; }
    .body { padding: 20px 12px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: baseline; }
    .body h2 { font-family: var(--serif); font-weight: 400; font-size: 1.75rem; line-height: 1.1; letter-spacing: -.01em; }
    .body .cat { font-size: .8rem; color: var(--faint); white-space: nowrap; }
    .body p { grid-column: 1 / -1; color: var(--muted); font-size: .94rem; font-weight: 300; max-width: 52ch; }
    .body .url { grid-column: 1 / -1; margin-top: 10px; font-size: .82rem; color: rgba(var(--a), .9); display: inline-flex; gap: 6px; align-items: center; }
    .body .url svg { width: 11px; height: 11px; transition: transform .4s var(--ease); }
    .card:hover .url svg { transform: translate(2px, -2px); }

    /* animations en pause hors écran */
    .card:not(.live) .stage *, .card:not(.live) .stage *::before, .card:not(.live) .stage *::after { animation-play-state: paused !important; }

    .empty { display: none; padding: 80px 0; text-align: center; color: var(--muted); }
    .empty button { margin-top: 14px; font: inherit; color: var(--ink); background: none; border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 18px; cursor: pointer; }

    footer { margin-top: 140px; border-top: 1px solid var(--line); }
    footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-top: 32px; padding-bottom: 40px; color: var(--faint); font-size: .88rem; }
    footer a { text-decoration: none; transition: color .3s; }
    footer a:hover { color: var(--ink); }

    /* =========================================================
       Les 25 scènes — chacune propre à sa ressource
       ========================================================= */

    /* 1 Scrollslide : plans 3D qui défilent */
    .v-scroll { perspective: 700px; }
    .v-scroll .track { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(52deg) rotateZ(-18deg); }
    .v-scroll .pl { position: absolute; left: 22%; width: 56%; height: 120px; border-radius: 12px; animation: scrollup 7s linear infinite; }
    .v-scroll .pl:nth-child(1) { background: linear-gradient(135deg, #ff7a59, #ffb36b); }
    .v-scroll .pl:nth-child(2) { background: linear-gradient(135deg, #5b5bff, #9a7bff); animation-delay: -1.75s; }
    .v-scroll .pl:nth-child(3) { background: linear-gradient(135deg, #18c3a5, #7be0c3); animation-delay: -3.5s; }
    .v-scroll .pl:nth-child(4) { background: linear-gradient(135deg, #f04ea0, #ff9bc8); animation-delay: -5.25s; }
    @keyframes scrollup { from { transform: translateY(260px) translateZ(0); opacity: 0; } 15%, 80% { opacity: 1; } to { transform: translateY(-300px) translateZ(60px); opacity: 0; } }
    .v-scroll .prog { position: absolute; right: 18px; top: 24px; bottom: 24px; width: 2px; background: rgba(255,255,255,.1); border-radius: 2px; }
    .v-scroll .prog::after { content: ""; position: absolute; left: 0; top: 0; width: 100%; background: #fff; border-radius: 2px; animation: prog 7s linear infinite; }
    @keyframes prog { from { height: 0; } to { height: 100%; } }

    /* 2 Minimal Gallery : cadres épurés */
    .v-minimal { background: #f3f1ec; gap: 0; }
    .v-minimal .frames { display: flex; gap: 14px; }
    .v-minimal .f { width: 64px; height: 84px; border: 1px solid #1a1a1a; position: relative; background: #fff; }
    .v-minimal .f::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 12px; height: 1px; background: #1a1a1a; transform-origin: left; animation: line 4.5s var(--ease) infinite; }
    .v-minimal .f:nth-child(2)::after { animation-delay: .3s; }
    .v-minimal .f:nth-child(3)::after { animation-delay: .6s; }
    .v-minimal .f i { position: absolute; top: 14px; left: 10px; width: 14px; height: 14px; border-radius: 50%; background: #1a1a1a; animation: dotmove 4.5s var(--ease) infinite; }
    @keyframes line { 0%, 10% { transform: scaleX(0); } 40%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes dotmove { 0%, 20% { transform: none; } 50%, 80% { transform: translate(28px, 22px); } 100% { transform: none; } }

    /* 3 Godly : défilé de sites */
    .v-godly { background: radial-gradient(circle at 50% 120%, #2a1650, #0b0b0c 70%); }
    .v-godly .rows { transform: rotate(-12deg) scale(1.15); display: grid; gap: 12px; }
    .v-godly .row { display: flex; gap: 12px; width: max-content; animation: marquee 16s linear infinite; }
    .v-godly .row:nth-child(2) { animation-direction: reverse; animation-duration: 20s; }
    .v-godly .row span { width: 120px; height: 72px; border-radius: 8px; flex: none; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* 4 Refero Styles : spécimen typographique */
    .v-refero { background: #0d0c0a; }
    .v-refero .aa { font-size: 6.5rem; line-height: 1; color: #f2e6cf; position: relative; width: 190px; height: 110px; }
    .v-refero .aa span { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; animation: cyc 9s infinite; }
    .v-refero .aa span:nth-child(1) { font-family: var(--serif); }
    .v-refero .aa span:nth-child(2) { font-family: var(--sans); font-weight: 500; animation-delay: 3s; }
    .v-refero .aa span:nth-child(3) { font-family: ui-monospace, Menlo, monospace; font-size: .8em; animation-delay: 6s; }
    @keyframes cyc { 0% { opacity: 0; filter: blur(8px); } 8%, 30% { opacity: 1; filter: none; } 38%, 100% { opacity: 0; filter: blur(8px); } }
    .v-refero .sw { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
    .v-refero .sw i { width: 18px; height: 18px; border-radius: 50%; }

    /* 5 Component Gallery : variantes d'un même bouton */
    .v-comp .gridb { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; }
    .v-comp .b { height: 32px; display: grid; place-items: center; font-size: .72rem; color: #ddd; animation: pick 6s infinite; }
    .v-comp .b:nth-child(1) { background: #fff; color: #000; border-radius: 6px; }
    .v-comp .b:nth-child(2) { border: 1px solid #555; border-radius: 999px; animation-delay: 1s; }
    .v-comp .b:nth-child(3) { background: #2f6bff; border-radius: 2px; animation-delay: 2s; }
    .v-comp .b:nth-child(4) { background: #222; border-radius: 10px; animation-delay: 3s; }
    .v-comp .b:nth-child(5) { text-decoration: underline; animation-delay: 4s; }
    .v-comp .b:nth-child(6) { background: linear-gradient(#3ddc97, #1fa774); color: #032; border-radius: 8px; animation-delay: 5s; }
    @keyframes pick { 0%, 14% { transform: scale(1.12); box-shadow: 0 0 0 2px #0b0b0c, 0 0 0 3px #fff; } 20%, 100% { transform: none; box-shadow: none; } }

    /* 6 Mobbin : parcours d'écrans */
    .v-mobbin { background: #0e1013; }
    .v-mobbin .phones { display: flex; gap: 18px; align-items: center; }
    .v-mobbin .ph { width: 62px; height: 124px; border-radius: 14px; border: 2px solid #2b2f36; background: #15181d; padding: 10px 7px; display: flex; flex-direction: column; gap: 5px; animation: lift 6s var(--ease) infinite; }
    .v-mobbin .ph:nth-child(2) { animation-delay: 2s; }
    .v-mobbin .ph:nth-child(3) { animation-delay: 4s; }
    .v-mobbin .ph i { display: block; height: 7px; border-radius: 3px; background: #2b3038; }
    .v-mobbin .ph i.h { height: 26px; background: #ffd23f; }
    .v-mobbin .ph:nth-child(2) i.h { background: #6c8cff; }
    .v-mobbin .ph:nth-child(3) i.h { background: #3ddc97; }
    @keyframes lift { 0%, 25% { transform: translateY(-8px); border-color: #fff; } 33%, 100% { transform: none; border-color: #2b2f36; } }

    /* 7 DESIGNmd : design system en Markdown */
    .v-md { justify-items: start; padding: 0 30px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; line-height: 1.9; }
    .v-md .code div { white-space: nowrap; overflow: hidden; width: 0; animation: type 8s steps(28) infinite; }
    .v-md .code div:nth-child(2) { animation-delay: .6s; } .v-md .code div:nth-child(3) { animation-delay: 1.2s; }
    .v-md .code div:nth-child(4) { animation-delay: 1.8s; } .v-md .code div:nth-child(5) { animation-delay: 2.4s; }
    @keyframes type { 0% { width: 0; } 12%, 85% { width: 28ch; } 100% { width: 0; } }
    .v-md .h { color: #fff; } .v-md .k { color: #8b8b8b; } .v-md .s { color: #e7b86b; } .v-md .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 6px; }

    /* 8 VibePrompt : un prompt devient un tableau de bord */
    .v-vibe { background: radial-gradient(circle at 50% 0%, #1c2a1f, #0b0b0c 70%); align-content: center; gap: 16px; }
    .v-vibe .prompt { width: 250px; padding: 9px 12px; border-radius: 10px; border: 1px solid #2a3a2d; background: #0f1611; font-size: .78rem; color: #b8f5c4; white-space: nowrap; overflow: hidden; }
    .v-vibe .prompt span { display: inline-block; overflow: hidden; vertical-align: bottom; width: 0; animation: typing 6s steps(26) infinite; border-right: 1.5px solid #b8f5c4; }
    @keyframes typing { 0% { width: 0; } 35%, 90% { width: 26ch; } 100% { width: 0; } }
    .v-vibe .bars { display: flex; align-items: end; gap: 8px; height: 70px; }
    .v-vibe .bars i { width: 20px; border-radius: 4px 4px 0 0; background: linear-gradient(#7af59a, #2b9a4f); transform-origin: bottom; animation: grow 6s var(--ease) infinite; }
    .v-vibe .bars i:nth-child(1) { height: 40%; } .v-vibe .bars i:nth-child(2) { height: 75%; animation-delay: .1s; } .v-vibe .bars i:nth-child(3) { height: 55%; animation-delay: .2s; }
    .v-vibe .bars i:nth-child(4) { height: 95%; animation-delay: .3s; } .v-vibe .bars i:nth-child(5) { height: 65%; animation-delay: .4s; } .v-vibe .bars i:nth-child(6) { height: 85%; animation-delay: .5s; }
    @keyframes grow { 0%, 38% { transform: scaleY(0); } 55%, 90% { transform: scaleY(1); } 100% { transform: scaleY(0); } }

    /* 9 21st.dev : composants branchés à un agent */
    .v-21st svg { width: 280px; height: 180px; }
    .v-21st .wire { stroke: #333; stroke-width: 1; fill: none; }
    .v-21st .pulse { stroke: #c9a7ff; stroke-width: 2; fill: none; stroke-dasharray: 14 200; animation: flow 2.6s linear infinite; }
    .v-21st .pulse:nth-of-type(2) { animation-delay: .8s; } .v-21st .pulse:nth-of-type(3) { animation-delay: 1.6s; }
    @keyframes flow { from { stroke-dashoffset: 214; } to { stroke-dashoffset: 0; } }
    .v-21st .core { fill: #0b0b0c; stroke: #c9a7ff; stroke-width: 1.5; }
    .v-21st .node { fill: #161616; stroke: #3a3a3a; }

    /* 10 Kinetics : rebond et inertie */
    .v-kin { background: #0d0b14; }
    .v-kin .floor { position: absolute; left: 30px; right: 30px; bottom: 44px; height: 1px; background: #2a2440; }
    .v-kin .ball { position: absolute; bottom: 45px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #ff8a3d 60%, #c24d1b); animation: bounce 1.4s cubic-bezier(.3, 0, .7, 1) infinite alternate, roll 5.6s linear infinite; }
    @keyframes bounce { 0% { transform: translateY(0) scale(1.25, .78); } 12% { transform: translateY(-14px) scale(.92, 1.08); } 100% { transform: translateY(-130px) scale(1); } }
    @keyframes roll { 0% { left: 14%; } 50% { left: calc(86% - 34px); } 100% { left: 14%; } }
    .v-kin .shadow { position: absolute; bottom: 38px; width: 34px; height: 8px; border-radius: 50%; background: rgba(255,138,61,.35); filter: blur(3px); animation: roll 5.6s linear infinite, shade 1.4s cubic-bezier(.3,0,.7,1) infinite alternate; }
    @keyframes shade { from { transform: scale(1.2); opacity: 1; } to { transform: scale(.5); opacity: .3; } }

    /* 11 shadcn/ui : interface sobre et réutilisable */
    .v-shadcn { background: #09090b; }
    .v-shadcn .panel { width: 230px; border: 1px solid #27272a; border-radius: 10px; padding: 16px; display: grid; gap: 12px; font-size: .78rem; color: #e4e4e7; }
    .v-shadcn .r { display: flex; justify-content: space-between; align-items: center; }
    .v-shadcn .r small { color: #71717a; display: block; font-size: .68rem; }
    .v-shadcn .sw { width: 34px; height: 19px; border-radius: 99px; background: #27272a; position: relative; animation: swbg 4s infinite; }
    .v-shadcn .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fafafa; animation: swk 4s var(--ease) infinite; }
    @keyframes swbg { 0%, 45% { background: #27272a; } 50%, 95% { background: #fafafa; } }
    @keyframes swk { 0%, 45% { transform: none; background: #fafafa; } 50%, 95% { transform: translateX(15px); background: #09090b; } }
    .v-shadcn .btn { height: 30px; border-radius: 6px; background: #fafafa; color: #09090b; display: grid; place-items: center; font-weight: 500; }

    /* 12 Aceternity UI : faisceau lumineux sur grille */
    .v-acet { background-color: #000; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 28px 28px; }
    .v-acet .spot { position: absolute; top: -60%; left: -10%; width: 60%; height: 220%; background: linear-gradient(90deg, transparent, rgba(120, 180, 255, .35), transparent); filter: blur(18px); transform: rotate(25deg); animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { left: -60%; } 100% { left: 120%; } }
    .v-acet .t { position: relative; font-family: var(--serif); font-size: 2.8rem; background: linear-gradient(180deg, #fff, #6b7280); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .v-acet .beam { position: absolute; bottom: 30px; left: 15%; right: 15%; height: 1px; background: linear-gradient(90deg, transparent, #7cc4ff, transparent); animation: beam 3s ease-in-out infinite; }
    @keyframes beam { 0%, 100% { opacity: .2; transform: scaleX(.3); } 50% { opacity: 1; transform: scaleX(1); } }

    /* 13 Magic UI : bordure lumineuse + étincelles */
    .v-magic .box { position: relative; width: 210px; height: 120px; border-radius: 16px; background: #0f0f12; display: grid; place-items: center; color: #e9e3ff; font-size: .95rem; overflow: hidden; }
    .v-magic .box::before { content: ""; position: absolute; inset: -60%; background: conic-gradient(from 0deg, transparent 0 75%, #ff6ad5 85%, #8b5cf6 92%, transparent 100%); animation: spin 3.5s linear infinite; }
    .v-magic .box::after { content: ""; position: absolute; inset: 1.5px; border-radius: 15px; background: #0f0f12; }
    .v-magic .box span { position: relative; z-index: 1; }
    .v-magic .spark { position: absolute; width: 8px; height: 8px; background: #fff; clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); animation: twinkle 2.4s infinite; }
    @keyframes twinkle { 0%, 100% { transform: scale(0) rotate(0); opacity: 0; } 50% { transform: scale(1.4) rotate(90deg); opacity: 1; } }
    @keyframes spin { to { transform: rotate(1turn); } }

    /* 14 Motion Primitives : forme qui se métamorphose */
    .v-motion { background: #0a0f0e; }
    .v-motion .morph { width: 110px; height: 110px; background: linear-gradient(135deg, #2ee6c5, #1b8cff); animation: morph 6s var(--ease) infinite; }
    @keyframes morph {
      0%, 100% { border-radius: 18px; transform: rotate(0); }
      25% { border-radius: 50%; transform: rotate(90deg) scale(.85); }
      50% { border-radius: 50% 10% 50% 10%; transform: rotate(180deg) scale(1.05); }
      75% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; transform: rotate(270deg) scale(.9); }
    }

    /* 15 Uiverse : éléments d'UI de la communauté */
    .v-uiverse { background: #0f0d18; }
    .v-uiverse .it { position: absolute; animation: float 6s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-12px) rotate(3deg); } }
    .v-uiverse .b1 { top: 30px; left: 26px; padding: 9px 16px; border-radius: 10px; background: #ffd23f; color: #1a1400; font-size: .75rem; font-weight: 500; box-shadow: 0 4px 0 #b8930a; }

    .v-blocks .page .cols b { height: 38px; border-radius: 6px; background: #1c1c1f; border: 1px solid #2a2a2e; }

    .v-aw .medal::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.7) 50%, transparent 65%); transform: translateX(-120%); animation: shine 3s ease-in-out infinite; }

      display: grid; place-items: center; font-family: var(--serif); font-size: 2rem; color: #fff; }

    /* 20 CSS Text Effects : texte animé */
    .v-text { background: #08080a; }
    .v-text .word { font-family: var(--serif); font-size: 4.4rem; font-style: italic; letter-spacing: -.02em; line-height: 1.1; }
    .v-text .word span { display: inline-block; padding: 0 .02em; background: linear-gradient(90deg, #ff8a3d, #ff3d8a, #8a3dff, #3dd2ff, #ff8a3d); background-size: 500% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: wave 2.4s ease-in-out infinite, hue 6s linear infinite; }

      ["Shadertoy", "shadertoy.com", "Effets visuels", "Des milliers de shaders à étudier, modifier et remixer.", "255,90,200", true,
        `<div class="stage v-shader"><canvas width="160" height="72" data-shader></canvas></div>`],
      ["3Dicons", "3dicons.co", "Ressources graphiques", "Une bibliothèque d'icônes 3D gratuites pour les interfaces modernes.", "167,139,250", false,
        `<div class="stage v-3d"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div><i class="sh"></i></div>`],
      ["Anime.js", "animejs.com", "Animation", "Une bibliothèque JavaScript légère pour animer le web.", "255,75,75", false,
        `<div class="stage v-anime"><div class="dots">${dots(45)}</div></div>`]
    ];

    document.getElementById('year').textContent = new Date().getFullYear();
    const grid = document.getElementById('grid');
    const filters = document.getElementById('filters');
    const q = document.getElementById('q');
    const ext = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 9 9 3M4 3h5v5"/></svg>';
    let cat = 'Tout';

    // Construction des cartes (une seule fois)
    const cards = ressources.map(([nom, site, categorie, desc, rgb, wide, scene]) => {
      const a = document.createElement('a');
      a.className = 'card' + (wide ? ' wide' : '');
      a.href = 'https://' + site;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.setProperty('--a', rgb);
      a.setAttribute('aria-label', `${nom} : ${desc} (s'ouvre dans un nouvel onglet)`);
      a.innerHTML = scene.replace('class="stage', 'aria-hidden="true" class="stage') +
        `<div class="body"><h2></h2><span class="cat"></span><p></p><span class="url"><span></span>${ext}</span></div>`;
      a.querySelector('h2').textContent = nom;
      a.querySelector('.cat').textContent = categorie;
      a.querySelector('p').textContent = desc;
      a.querySelector('.url span').textContent = site;
      a.dataset.cat = categorie;
      a.dataset.text = (nom + ' ' + site + ' ' + categorie + ' ' + desc).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      a.addEventListener('pointermove', e => {
        const r = a.getBoundingClientRect();
        a.style.setProperty('--x', (e.clientX - r.left) + 'px');
        a.style.setProperty('--y', (e.clientY - r.top) + 'px');
      });
      grid.append(a);
      return a;
    });

    // Filtres
    for (const c of ['Tout', ...new Set(ressources.map(r => r[2]))]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'filter'; b.textContent = c;
      b.setAttribute('aria-pressed', c === cat);
      b.addEventListener('click', () => setCat(c));
      filters.append(b);
    }
    function setCat(c) {
      cat = c;
      filters.querySelectorAll('.filter').forEach(x => x.setAttribute('aria-pressed', x.textContent === c));
      render();
    }
    function render() {
      const term = q.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      let n = 0;
      cards.forEach(card => {
        const ok = (cat === 'Tout' || card.dataset.cat === cat) && (!term || card.dataset.text.includes(term));
        card.hidden = !ok;
        if (ok) n++;
      });
      document.getElementById('empty').style.display = n ? 'none' : 'block';
    }
    q.addEventListener('input', render);
    document.getElementById('reset').addEventListener('click', () => { q.value = ''; setCat('Tout'); });

    // Entrée orchestrée + pause des animations hors écran
    let order = 0;
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        const card = e.target;
        card.classList.toggle('live', e.isIntersecting);
        if (e.isIntersecting && !card.classList.contains('in')) {
          card.style.setProperty('--d', (Math.min(order++, 5) * 0.08 + (performance.now() < 1500 ? 0.6 : 0)) + 's');
          card.classList.add('in');
          setTimeout(() => { order = 0; }, 120);
        }
      });
    }, { rootMargin: '0px 0px -8% 0px' });
    cards.forEach(c => io.observe(c));

    // Shadertoy : petit plasma calculé en temps réel
    const cv = document.querySelector('[data-shader]');
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(cv.width, cv.height);
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    function plasma(t) {
      const card = cv.closest('.card');
      if (card.classList.contains('live') || !t) {
        const w = cv.width, h = cv.height, s = t / 1000;
        for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
          const u = x / w * 6, v = y / h * 3;
          const k = Math.sin(u + s) + Math.sin(v * 1.6 - s * 1.3) + Math.sin((u + v) * .7 + s * .8) + Math.sin(Math.hypot(u - 3, v - 1.5) * 1.8 - s * 1.5);
          const i = (y * w + x) * 4;
          img.data[i] = 128 + 127 * Math.sin(k * Math.PI * .5);
          img.data[i + 1] = 60 + 60 * Math.sin(k * Math.PI * .5 + 2.1);
          img.data[i + 2] = 150 + 105 * Math.sin(k * Math.PI * .5 + 4.2);
          img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      }
      if (!still) requestAnimationFrame(plasma);
    }
    plasma(0);
  </script>
</body>
</html>
